app = 'ftl-firehose'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '8080'
  BACKFILL_HOURS = '24'
  HELIUS_TARGETED_STREAM = '1'
  PROGRAM_DISCOVERY = '1'
  PROGRAM_DISCOVERY_BACKFILL = '1'
  COMPOSER_URL = 'https://the-composer-svc.fly.dev'

[mounts]
  source = 'ftl_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'performance-8x'
  memory = '16gb'
